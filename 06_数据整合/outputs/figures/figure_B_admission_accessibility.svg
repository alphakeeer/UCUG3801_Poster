  <g id="text_21">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19374b" x="35.64" y="26.928" transform="rotate(-0 35.64 26.928)">Housing, admission channels and modeled walks</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="35.64" y="48.96" transform="rotate(-0 35.64 48.96)">Three residential origins | primary grade 1, 2026 | conditional pathways, no observed allocations</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(35.64 398.412)">Eligibility: full ownership, hukou, exact address, lease or points documentation still require review.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(35.64 413.712)">Renters' coordinated destinations and actual admissions remain unknown; Xian Cun is one listed option.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(35.64 445.9032)">All times use archived POI routes; gates and actual trips were unobserved. Housing indicators describe different evidence types.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(35.64 461.2032)">Sources: Amap snapshot, 12 Nov 2026; Tianhe 2026 admissions and channel plans; archived housing quotations.</text>
  </g>
