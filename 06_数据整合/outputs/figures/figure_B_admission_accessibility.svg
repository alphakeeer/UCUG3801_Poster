  <g id="text_21">
   <text style="font-weight: 500; font-size: 19px; font-family: 'WenQuanYi Zen Hei'; text-anchor: start; fill: #19374b" x="35.64" y="26.928" transform="rotate(-0 35.64 26.928)">住房背景、招生渠道与步行可达性</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 500; font-size: 10px; font-family: 'WenQuanYi Zen Hei'; text-anchor: start" x="35.64" y="48.96" transform="rotate(-0 35.64 48.96)">三个住宅起点｜2026小学一年级｜条件性申请渠道；实际录取未观察</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 398.393719)">资格须核户籍、产权、具体门牌、备案或积分材料；安置户与合格租户按相应统筹条件审核。</text>
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 413.712)">租户实际统筹去向及家庭录取未观察；冼村小学仅为一个名单内志愿例。</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 445.828669)">路线使用归档POI，实际校门和真实通学未观察。住房标签指标不同；南国两条租盘不合成均价。</text>
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 461.2032)">来源：2026-11-12高德路线；天河2026招生与渠道计划；原住房摘录及11月13日补证。</text>
  </g>
