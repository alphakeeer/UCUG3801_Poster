  </g>
  <g id="text_19">
   <text style="font-weight: 500; font-size: 10px; font-family: 'WenQuanYi Zen Hei'; text-anchor: start" x="35.64" y="51.408" transform="rotate(-0 35.64 51.408)">Grade 1 in Tianhe, 2026 | Three origins, two specified destination choices</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 392.020734)">Address-linked eligibility requires household and address documents. Xian Cun is one listed preference example.</text>
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 406.368)">Both series use archived point-to-point Amap estimates; gates, actual allocations and commutes were unobserved.</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 443.371078)">Sources: Amap, 12 Nov 2026; Tianhe 2026 primary catchment rules and migrant-points intake list.</text>
   <text style="font-weight: 500; font-size: 9px; font-family: 'WenQuanYi Zen Hei'" transform="translate(35.64 457.776)">Purposeful case comparison; no housing-cost ranking or nearest-eligible-school claim.</text>
  </g>
